name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Bundle smoke test
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          go build -o "ggs$ext" .
          printf "[repo]\nurl = 'https://github.com/org/course.git'\n[auth]\ntoken = 'github_pat_CI_PLAINTEXT_CHECK'\n" > class.toml
          "./ggs$ext" bundle class.toml -o "course$ext"
          "./course$ext" version | grep '^course '
          "./course$ext" bundle --show | grep "token = '<redacted>'"
          if grep -q CI_PLAINTEXT_CHECK "course$ext"; then echo "token readable in the bundled binary"; exit 1; fi
      - name: Verify the bundled macOS code signature
        if: runner.os == 'macOS'
        run: |
          uname -m
          codesign --verify --strict --verbose=2 ggs
          codesign --verify --strict --verbose=2 course
          ./course version

  cross-build:
    name: build all targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --snapshot --clean
      - name: Collect binaries
        run: |
          mkdir out
          for d in dist/go-git-serve_*/; do
            target=$(basename "$d" | sed -E 's/_(v[0-9.]+)$//')   # drop _v1 / _v8.0 suffix
            for f in "$d"go-git-serve*; do
              ext=""; case "$f" in *.exe) ext=".exe";; esac
              cp "$f" "out/${target}${ext}"
            done
          done
          (cd out && sha256sum * > checksums.txt)
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: go-git-serve-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 30
