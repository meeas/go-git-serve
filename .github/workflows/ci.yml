name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  cross-build:
    name: build all targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --snapshot --clean
      - name: Collect binaries
        run: |
          mkdir out
          for d in dist/go-git-serve_*/; do
            target=$(basename "$d" | sed -E 's/_(v[0-9.]+)$//')   # drop _v1 / _v8.0 suffix
            for f in "$d"go-git-serve*; do
              ext=""; case "$f" in *.exe) ext=".exe";; esac
              cp "$f" "out/${target}${ext}"
            done
          done
          (cd out && sha256sum * > checksums.txt)
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: go-git-serve-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 30
